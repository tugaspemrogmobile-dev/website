name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: 1 }
      - name: Lint (undefined names across the app files, likely bugs)
        run: npm run lint
      - name: Unit tests (pure logic, no browser)
        run: npm run test:unit
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/smoke.py
      - name: Layout stress test
        run: LAYOUT_ONLY=1 python tests/stress.py stress-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stress-report, path: stress-out }
