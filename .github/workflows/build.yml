name: Build Windows, macOS and Android apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']   # pushing a tag like v1.0.0 also publishes a GitHub Release with all three downloads

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Turn off testing features (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release_strip.js
      - run: npm run dist:win
      - name: Check the built app starts
        run: node tests/launch_check.js "dist/win-unpacked/My Productivity Web.exe"
      # Code signing (SignPath, free for open source). Stays off until the SIGNPATH_* secrets exist: apply at
      # signpath.org with this repository, then add SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID.
      - name: Is signing set up?
        id: sign
        env: { TOKEN: '${{ secrets.SIGNPATH_API_TOKEN }}' }
        shell: bash
        run: echo "enabled=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: unsigned
        if: steps.sign.outputs.enabled == 'true'
        with: { name: My-Productivity-Web-Windows-unsigned, path: dist/*.exe }
      - uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1, pinned
        if: steps.sign.outputs.enabled == 'true'
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: MyProductivityWeb
          signing-policy-slug: release-signing
          github-artifact-id: '${{ steps.unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: dist
      - uses: actions/upload-artifact@v4
        with: { name: My-Productivity-Web-Windows, path: dist/*.exe }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Turn off testing features (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release_strip.js
      - run: npm run dist:mac
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Check the built app starts
        run: node tests/launch_check.js "$(ls -d "dist/mac-universal/My Productivity Web.app")/Contents/MacOS/My Productivity Web"
      - uses: actions/upload-artifact@v4
        with: { name: My-Productivity-Web-macOS, path: dist/*.zip }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Turn off testing features (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/release_strip.js
      - run: npx cap add android
      - name: Generate Android icons (optional)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#00000000' --iconBackgroundColorDark '#00000000' --splashBackgroundColor '#080808' --splashBackgroundColorDark '#080808' || true
      - run: npx cap sync android
      - name: Icon without a background
        # plain transparent icons, no adaptive icon: launchers fill an adaptive icon's empty background with a colour
        run: rm -rf android/app/src/main/res/mipmap-anydpi-v26 && cp -r native/android-res/* android/app/src/main/res/
      - name: Apply version and signing settings
        run: |
          echo "apply from: '../../native/release.gradle'" >> android/app/build.gradle
      # signed release APK when the ANDROID_KEYSTORE_* secrets exist, otherwise the debug-signed APK as before
      - name: Build APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GROUNDWORK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GROUNDWORK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            GROUNDWORK_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../app.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../app.apk
          fi
      - run: mkdir out && cp app.apk "out/My-Productivity-Web-$(node -p "require('./package.json').version")-Android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: My-Productivity-Web-Android, path: out/*.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="## $v" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Checksums
        run: cd files && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with: { files: files/*, body_path: notes.md, name: 'My Productivity Web ${{ github.ref_name }}' }
      # the desktop auto-update needs the setup and its .sha256 on the release; fail loudly if either is missing
      - name: Check the update files are on the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$names"
          setup=$(echo "$names" | grep -E -- '-Windows-setup\.exe$') || { echo "::error::no Windows setup on the release"; exit 1; }
          echo "$names" | grep -qx "$setup.sha256" || { echo "::error::$setup.sha256 missing: auto-update would refuse it"; exit 1; }
