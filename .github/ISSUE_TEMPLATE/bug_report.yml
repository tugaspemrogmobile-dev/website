name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.2.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Android, Browser]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: shots
    attributes:
      label: Screenshots
      description: Drag images here if it's visual
