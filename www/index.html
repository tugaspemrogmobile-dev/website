<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habits | My Productivity Web</title>
<meta name="theme-color" content="#080808">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Productivity Web">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<script>if(location.hash==='#widget'||location.hash.startsWith('#ask~'))document.documentElement.classList.add('widget')</script>
<div class="app">
  <header class="top">
    <div class="ttl" id="ttl">Habits</div>
    <nav class="pnav" id="nav" aria-label="Main"></nav>
    <div class="tact"><button class="gear" data-act="search" aria-label="Search" id="searchBtn"></button><button class="gear" data-act="gear" aria-label="Settings" id="gearBtn"></button></div>
    <div class="menu" id="menu" hidden></div>
  </header>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden role="status"></div>
<div id="lock" hidden></div>
<div id="focusbar" class="focusbar" hidden role="timer" aria-live="off"></div>
<input type="file" id="impFile" accept="application/json,.json" hidden>

<script>/* language: the user's choice, else the device language; English needs no file */
(function(){try{if(!localStorage.getItem('groundwork-v2'))for(var i=localStorage.length;i--;){var k=localStorage.key(i);if(k&&k.indexOf('daybook-')===0&&localStorage.getItem('groundwork-'+k.slice(8))===null)localStorage.setItem('groundwork-'+k.slice(8),localStorage.getItem(k))}for(var j=localStorage.length;j--;){var o=localStorage.key(j);if(o&&o.indexOf('daybook-')===0&&localStorage.getItem('groundwork-'+o.slice(8))!==null)localStorage.removeItem(o)}}catch(e){}})(); // data saved under the old name moves across once
(function(){var L=['id'],l='';try{l=(JSON.parse(localStorage.getItem('groundwork-prefs')||'{}').lang)||''}catch(e){}
if(!l)l=(navigator.language||'en').slice(0,2).toLowerCase();if(L.indexOf(l)>=0){window.GROUNDWORK_LANG=l;document.documentElement.lang=l;document.write('<script src="i18n/'+l+'.js"><\/script>')}})()</script>
<!-- the app: classic scripts in this order, sharing one scope (no build step) -->
<script src="js/core.js"></script>
<script src="js/habits.js"></script>
<script src="js/tasks.js"></script>
<script src="js/goals.js"></script>
<script src="js/settings.js"></script>
<script src="js/render.js"></script>
<script src="js/events.js"></script>
<script src="js/extras.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
<!-- build -->
